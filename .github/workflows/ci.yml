name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (라이선스 동의)
        # setup-android 액션은 upstream 'tools' 패키지 삭제로 동작 불능 —
        # 러너 내장 SDK + 직접 동의로 대체 (부족분은 AGP가 자동 설치)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        working-directory: android
        run: ./gradlew :services:mac:testDebugUnitTest :services:plan:testDebugUnitTest --console=plain

      - name: 린트
        working-directory: android
        run: ./gradlew lintDebug --console=plain