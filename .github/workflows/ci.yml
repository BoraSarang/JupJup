name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (라이선스 동의)
        uses: android-actions/setup-android@v3
        with:
          # 'tools' 패키지는 upstream에서 삭제됨 — 명시 지정으로 회피
          packages: platform-tools "build-tools;36.0.0" "platforms;android-36"

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew :services:mac:testDebugUnitTest :services:plan:testDebugUnitTest --console=plain

      - name: 린트
        run: ./gradlew lintDebug --console=plain