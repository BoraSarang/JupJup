name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (라이선스 동의)
        # setup-android 액션은 upstream 'tools' 패키지 삭제로 동작 불능 —
        # 러너 내장 SDK + 직접 동의로 대체 (부족분은 AGP가 자동 설치)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 릴리스 APK 빌드
        working-directory: android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 태그에 해당하는 CHANGELOG 섹션 추출
        id: changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"          # 1.0.0
          mm="${tag%.*}"                       # 1.0
          section() {
            local pat="$1"
            awk -v p="$pat" '
              BEGIN { capt = 0 }
              $0 ~ "^## \\[" p "\\]" { capt = 1; next }
              capt && /^## / { exit }
              capt { print }
            ' docs/CHANGELOG.md
          }
          body="$(section "v${tag}")"
          [ -z "$body" ] && body="$(section "${tag}")"
          [ -z "$body" ] && body="$(section "v${mm}")"
          if [ -z "$body" ]; then
            printf "JupJup %s\n\n자세한 변경 사항은 docs/CHANGELOG.md를 참고하세요.\n" "$tag" > "$RUNNER_TEMP/release_body.md"
          else
            printf '%s' "$body" > "$RUNNER_TEMP/release_body.md"
          fi
          echo "body_ready=1" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          body_path: ${{ runner.temp }}/release_body.md