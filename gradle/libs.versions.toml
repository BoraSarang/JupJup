[versions]
agp = "9.3.1"
# R6: Android SDK 단일 진실 (4 모듈 하드코딩 제거)
compileSdk = "36"
minSdk = "26"
ksp = "2.3.11"
ktor = "3.5.2"
coroutines = "1.10.1"
serialization = "1.8.1"
room = "2.7.0"
work = "2.9.0"
jsoup = "1.22.2"
datastore = "1.1.7"
coreKtx = "1.17.0"
lifecycle = "2.9.0"
activityKtx = "1.10.1"
appcompat = "1.7.0"
material = "1.12.0"
fragmentKtx = "1.8.0"
recyclerview = "1.3.2"
timber = "5.0.1"
mlkitTranslate = "17.0.3"
mlkitLangId = "17.0.6"
desugar = "2.1.5"
junit = "4.13.2"
mockk = "1.13.13"
espresso = "3.6.1"
testRunner = "1.6.1"
testExtJunit = "1.2.1"

[libraries]
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
