<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0066FF">
    <title>프롬프트팩토리</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <button class="logo" id="logoBtn" type="button" title="처음으로">🧪 프롬프트팩토리</button>
            <div class="header-info">
                <span class="status-dot" id="statusDot" title="서버 상태"></span>
                <span id="lastRun">확인 중…</span>
                <button id="settingsBtn" class="btn-gear" type="button" aria-label="설정 열기" title="설정">⚙️</button>
            </div>
        </div>
        <div class="chip-row chip-scroll" id="promptChips" aria-label="프롬프트 선택"></div>
    </header>

    <main class="main">
        <div class="report-grid" id="reportGrid">
            <aside class="date-list" id="dateList" aria-label="실행 날짜 목록"></aside>
            <section class="report-body" id="reportBody" aria-label="리포트 본문">
                <p class="empty-state">불러오는 중…</p>
            </section>
        </div>
    </main>

    <div class="backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-label="설정" hidden>
        <div class="drawer-head">
            <h2>설정</h2>
            <button id="drawerClose" class="btn-filter-close" type="button" aria-label="설정 닫기">✕</button>
        </div>
        <div class="drawer-body">
            <div class="section-title-row">
                <h3>프롬프트</h3>
                <button id="btnNewPrompt" class="btn btn-primary btn-sm" type="button">+ 새 프롬프트</button>
            </div>
            <form id="promptForm" class="settings-form hidden">
                <input type="hidden" id="pfId">
                <div class="form-group">
                    <label for="pfTitle">제목</label>
                    <input type="text" id="pfTitle" placeholder="예: 오늘의 Mac 뉴스" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="pfContent">프롬프트 내용</label>
                    <textarea id="pfContent" rows="8" placeholder="AI에게 보낼 프롬프트"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pfProvider">공급자</label>
                        <select id="pfProvider">
                            <option value="OPENROUTER">OpenRouter</option>
                            <option value="NIM">NVIDIA NIM</option>
                            <option value="GOOGLE_AI_STUDIO">Google AI Studio</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pfModel">모델</label>
                        <select id="pfModel"></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pfScheduleType">스케줄</label>
                        <select id="pfScheduleType">
                            <option value="daily">매일</option>
                            <option value="once">1회</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pfScheduleValue">실행 시각</label>
                        <input type="time" id="pfScheduleValue" value="09:00">
                    </div>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="pfEnabled" checked> 자동 실행 활성화
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="pfUsePrev"> 이전 성공 결과를 다음 실행에 주입
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <button type="button" id="btnCancelPrompt" class="btn btn-secondary">취소</button>
                </div>
            </form>
            <hr class="divider">
            <h3>공급자 · API 키 · 모델</h3>
            <div id="providerList" class="provider-list">
                <p class="empty-state">불러오는 중…</p>
            </div>
        </div>
    </aside>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="/app.js"></script>
</body>
</html>
