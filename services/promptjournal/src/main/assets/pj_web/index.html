<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111111">
    <title>프롬프트 저널 — 뉴스룸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="top-rule"></div>
    <header class="header">
        <div class="header-content">
            <div class="masthead-sub"><span>Vol. I — Est. 2025 · Prompt Journal Archive</span><span class="masthead-sub-right">서울 · 무료 AI 모델 취재 일지</span></div>
            <div class="masthead">
                <div class="masthead-title">
                    <button class="logo serif" id="logoBtn" type="button" title="처음으로">PROMPT JOURNAL</button>
                    <span class="logo-ko serif">프롬프트 저널</span>
                </div>
                <div class="masthead-meta">
                    <div class="masthead-date"><div id="todayDate">확인 중…</div><div class="masthead-date-sub" id="todayDateSub"></div></div>
                    <div class="edition-box serif"><span class="edition-small">제</span><span id="editionNo">–</span><span class="edition-small">호</span></div>
                </div>
            </div>
            <div class="masthead-foot">
                <span id="channelLine">브리핑 채널</span>
                <span class="header-info"><span class="status-dot" id="statusDot" title="서버 상태"></span><span id="lastRun">확인 중…</span><button id="settingsBtn" class="btn-gear" type="button" aria-label="설정 열기" title="설정">⚙️</button></span>
            </div>
        </div>
        <div class="chip-row chip-scroll" id="promptChips" aria-label="브리핑 채널 선택"></div>
        <div class="pill-row" id="cycleRow"><span class="pill" id="cyclePill" hidden></span></div>
    </header>

    <main class="main">
        <div class="report-grid" id="reportGrid">
            <aside class="date-list" id="dateList" aria-label="발행 아카이브"></aside>
            <section class="report-body" id="reportBody" aria-label="기사 지면">
                <p class="empty-state">불러오는 중…</p>
            </section>
        </div>
    </main>

    <div class="backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-label="설정" hidden>
        <div class="drawer-head">
            <h2>편집국 설정</h2>
            <button id="drawerClose" class="btn-filter-close" type="button" aria-label="설정 닫기">✕</button>
        </div>
        <div class="drawer-tabs" role="tablist">
            <button id="tabChannel" class="drawer-tab active" type="button" role="tab">브리핑 채널</button>
            <button id="tabSources" class="drawer-tab" type="button" role="tab">취재원 관리</button>
        </div>
        <div class="drawer-body">
            <section id="panelChannel">
                <div class="section-title-row">
                    <h3>브리핑 채널</h3>
                    <button id="btnNewPrompt" class="btn btn-primary btn-sm" type="button">+ 새 채널</button>
                </div>
                <div id="channelList" class="channel-list">
                    <p class="empty-state">불러오는 중…</p>
                </div>
                <form id="promptForm" class="settings-form hidden">
                    <input type="hidden" id="pfId">
                    <div class="form-group">
                        <label for="pfTitle">채널명</label>
                        <input type="text" id="pfTitle" placeholder="예: 무료 AI 모델 통합 일일 리포트" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="pfContent">취재 지침서</label>
                        <textarea id="pfContent" rows="8" placeholder="AI에게 보낼 취재 지침"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pfProvider">취재원</label>
                            <select id="pfProvider">
                                <option value="OPENROUTER">OpenRouter</option>
                                <option value="GOOGLE_AI_STUDIO">Google AI Studio</option>
                                <option value="OPENCODE_ZEN">OpenCode Zen</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pfModel">모델</label>
                            <select id="pfModel"></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pfScheduleType">발행 주기</label>
                            <select id="pfScheduleType">
                                <option value="daily">매일</option>
                                <option value="once">1회</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pfScheduleValue">발행 시각</label>
                            <input type="time" id="pfScheduleValue" value="09:00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="pfEnabled" checked> 자동 발행 활성화
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="pfUsePrev"> 지난 호 결과를 다음 취재에 주입
                        </label>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">저장</button>
                        <button type="button" id="btnCancelPrompt" class="btn btn-secondary">취소</button>
                    </div>
                </form>
            </section>
            <section id="panelSources" hidden>
                <h3>취재원 관리</h3>
                <div id="providerList" class="provider-list">
                    <p class="empty-state">불러오는 중…</p>
                </div>
            </section>
        </div>
    </aside>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="/app.js"></script>
</body>
</html>
